name: CI de contratos e serviço

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contratos:
    name: Contratos
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Preparar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Instalar dependências
        run: npm ci --ignore-scripts
        working-directory: contracts
      - name: Testar contratos
        run: npm test
        working-directory: contracts

  servico:
    name: Serviço
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Preparar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Instalar dependências
        run: npm ci
        working-directory: service
      - name: Verificar tipos
        run: npm run typecheck
        working-directory: service
      - name: Testar serviço
        run: npm test
        working-directory: service
